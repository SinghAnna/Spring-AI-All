

spring.application.name=R.A.G

# ==================================================
# GEMINI CHAT
# ==================================================

spring.ai.openai.api-key=${GEMINI_API_KEY}

spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com/v1beta/openai

spring.ai.openai.chat.model=gemini-3.5-flash-lite


# ==================================================
# EMBEDDING
# ==================================================

# IMPORTANT: Disable OpenAI Embedding
spring.ai.model.embedding=none

# Enable Google GenAI Text Embedding
spring.ai.model.embedding.text=google-genai

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# DON'T use text-embedding-004
spring.ai.google.genai.embedding.text.model=gemini-embedding-001


# ==================================================
# MYSQL
# ==================================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_memory
spring.datasource.username=root
spring.datasource.password=anantsingh922004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# CHAT MEMORY
# ==================================================

spring.ai.chat.memory.repository.jdbc.initialize-schema=always


# ==================================================
# REDIS
# ==================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379


# ==================================================
# REDIS VECTOR STORE
# ==================================================

spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=rag-index
spring.ai.vectorstore.redis.prefix=rag:

# ==================================================
# EMBEDDING
# ==================================================


spring.ai.google.genai.embedding.text.dimensions=768




